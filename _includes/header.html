<header class="site-header">
  <div class="wrap">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
      <a href="{{ '/experience/' | relative_url }}"{% if page.url == '/experience/' %} class="active"{% endif %}>Experience</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} class="active"{% endif %}>Projects</a>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="icon-sun">{% include icon.html name="sun" %}</span>
        <span class="icon-moon">{% include icon.html name="moon" %}</span>
      </button>
    </nav>
  </div>
</header>
