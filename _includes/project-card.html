<article class="project-card">
  <img class="project-card__image" src="{{ project.image | relative_url }}" alt="{{ project.name }} screenshot" loading="lazy">
  <div class="project-card__body">
    <h2>{{ project.name }}</h2>
    <p>{{ project.description }}</p>
    <div class="project-card__links">
      <a href="{{ project.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ project.link }}" target="_blank" rel="noopener">Live / Repo</a>
    </div>
  </div>
</article>
