<li>
  <div class="project-header">
    <span class="project-name">{{ project.name }}</span>
    {% if project.dates %}<span class="exp-dates">{{ project.dates }}</span>{% endif %}
  </div>
  <div class="project-blurb-row">
    {% if project.blurb %}<p class="exp-blurb">{{ project.blurb }}</p>{% endif %}
    {% if project.github %}<a href="{{ project.github }}" target="_blank" rel="noopener" aria-label="{{ project.name }} on GitHub">{% include icon.html name="github" %}</a>{% endif %}
  </div>
  {% if project.stack %}<div class="project-stack">{{ project.stack }}</div>{% endif %}
</li>
