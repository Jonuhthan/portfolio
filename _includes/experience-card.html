<article class="experience-card">
  <img class="experience-card__image" src="{{ experience.image | relative_url }}" alt="{{ experience.company }} logo" loading="lazy">
  <div class="experience-card__body">
    <h2>{{ experience.title }}</h2>
    <p class="experience-card__meta">{{ experience.company }} &middot; {{ experience.date }}</p>
    <ul>
      {% for bullet in experience.bullets %}
      <li>{{ bullet }}</li>
      {% endfor %}
    </ul>
  </div>
</article>
